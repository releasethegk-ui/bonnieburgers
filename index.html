<body style="margin:0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@700;800;900&family=Commissioner:wght@400;500;600;700&display=swap">
<style>
/* Layout: hot griddle (ink) hero with a 3D smash stack, cheese-yellow ticker, wax-paper menu, yellow "come eat it hot" finale */
:root{
  /* Bonnie brand: pastel pink + black (from their Instagram), hot pink for small accents */
  --ink:#121014; --ink-2:#1E1A20; --ink-line:#3A3239;
  --bun:#F6E2EC; --paper:#FBF0F5; --paper-line:#EBCFDD;
  --cheese:#EBC2DA; --cheese-deep:#C9739F; --ketchup:#C92A64; --pickle:#5F8233;
  --text:#121014; --muted:#66525D; --on-ink:#FBF0F5; --on-ink-muted:#CDB3C1;
  --font-display:"Fira Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --font-body:"Commissioner","Segoe UI",system-ui,sans-serif;
  --gut:clamp(16px,4vw,44px); --maxw:1200px; --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--text);font:400 1rem/1.6 var(--font-body);overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:900;line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
p{margin:0}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gut)}
section{scroll-margin-top:72px}
:focus-visible{outline:3px solid var(--ketchup);outline-offset:3px;border-radius:6px}
.eyebrow{font:800 .85rem/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ketchup)}
.ph{display:inline-block;font:600 .78rem/1.3 var(--font-body);border:1.5px dashed currentColor;border-radius:6px;padding:.05em .45em;opacity:.75;text-transform:none;letter-spacing:0}
.wax{background-color:var(--paper);background-image:
  linear-gradient(45deg,rgba(18,16,20,.035) 25%,transparent 25%,transparent 75%,rgba(18,16,20,.035) 75%),
  linear-gradient(45deg,rgba(18,16,20,.035) 25%,transparent 25%,transparent 75%,rgba(18,16,20,.035) 75%);
  background-size:22px 22px;background-position:0 0,11px 11px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.55em;font:800 1.08rem/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  padding:.9em 1.3em;border-radius:12px;border:2.5px solid var(--ink);background:var(--cheese);color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--paper)}
.btn.on-ink{border-color:var(--cheese);box-shadow:4px 4px 0 var(--cheese)}
.btn.on-ink.alt{background:transparent;color:var(--on-ink);border-color:var(--on-ink);box-shadow:4px 4px 0 var(--on-ink)}
.btn.sm{font-size:.95rem;padding:.6em .95em;box-shadow:3px 3px 0 var(--ink)}
.btn svg{width:1.15em;height:1.15em;flex:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);color:var(--on-ink);border-bottom:3px solid var(--cheese)}
.hdr .wrap{display:flex;align-items:center;gap:12px;min-height:62px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font:900 1.55rem/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;color:var(--on-ink);white-space:nowrap}
.logo .dot{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid var(--cheese)}
.logo .wm{height:30px;width:auto}
.logo .sub{font:800 .78rem/1 var(--font-display);letter-spacing:.16em;color:var(--cheese);align-self:flex-end;margin-bottom:3px}
.mascot-sticker{position:absolute;top:2%;left:0;width:clamp(86px,16%,124px);transform:rotate(-10deg);filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45));z-index:2;pointer-events:none}
.quote{margin-top:34px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;background:var(--ink);color:var(--on-ink);border-radius:24px;padding:clamp(20px,4vw,34px);box-shadow:8px 8px 0 var(--cheese)}
.quote img{width:clamp(80px,12vw,120px);border-radius:50%}
.quote h3{font-size:clamp(1.7rem,4vw,2.4rem);color:var(--cheese)}
.quote p{margin-top:10px;color:var(--on-ink-muted);max-width:68ch}
.quote cite{display:block;margin-top:10px;font:700 .85rem/1 var(--font-body);font-style:normal;color:var(--cheese)}
@media (max-width:600px){.quote{grid-template-columns:minmax(0,1fr)}}
.storefront img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logo b{color:var(--cheese);font-weight:900}
.pill{display:inline-flex;align-items:center;gap:7px;font:700 .82rem/1 var(--font-body);padding:.45em .75em;border-radius:999px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--on-ink);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--cheese);box-shadow:0 0 0 3px rgba(235,194,218,.25)}
.pill.open i{background:#5FD06A;box-shadow:0 0 0 3px rgba(95,208,106,.25)}
.pill.closed i{background:var(--ketchup);box-shadow:0 0 0 3px rgba(215,38,30,.25)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--on-ink-muted);border-radius:10px;overflow:hidden}
.lang button{font:800 .9rem/1 var(--font-display);letter-spacing:.08em;padding:.5em .7em;background:transparent;color:var(--on-ink);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cheese);color:var(--ink)}
@media (max-width:760px){.hdr .pill,.hdr .btn{display:none}.logo .wm{height:26px}.logo .sub{display:none}}

/* hero */
.hero{background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  radial-gradient(60% 70% at 72% 55%,rgba(235,194,218,.20),transparent 65%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 6px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;padding-block:clamp(28px,6vw,72px) clamp(36px,6vw,80px)}
.hero h1{font-size:clamp(3rem,8.4vw,6.6rem);color:var(--on-ink)}
.hero h1 em{font-style:normal;color:var(--cheese)}
.hero .sub{font-size:clamp(1.05rem,2vw,1.3rem);color:var(--on-ink-muted);margin-top:18px;max-width:30ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.trust{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.badge{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:800 .95rem/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;padding:.55em .8em;border-radius:10px}
.badge.press{background:var(--ketchup);color:#FFF4E2;transform:rotate(-2deg)}
.badge.stars{background:var(--ink-2);border:1px solid var(--ink-line);color:var(--on-ink)}
.badge.stars .s{color:var(--cheese);letter-spacing:.08em}
.stage{position:relative;width:100%;aspect-ratio:1/1;max-width:100%}
.stage canvas{width:100%;height:100%;display:block;touch-action:pan-y;cursor:pointer}
.stage .fallback{position:absolute;inset:6%;width:88%;height:88%}
.stage .lbl{position:absolute;left:0;top:0;pointer-events:none;font:800 .92rem/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:var(--cheese);padding:.4em .6em;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .2s;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.stage .lbl::before{content:"";position:absolute;top:50%;width:22px;height:2px;background:var(--cheese)}
.stage .lbl.r::before{right:100%}
.stage .lbl.l::before{left:100%}
.stage .tap{position:absolute;bottom:2%;left:0;right:0;text-align:center;font:700 .85rem/1 var(--font-body);color:var(--on-ink-muted)}
@media (max-width:860px){
  .hero .wrap{grid-template-columns:minmax(0,1fr)}
  .stage{max-width:430px;margin-inline:auto;aspect-ratio:1/0.95}
}

/* ticker */
.ticker{background:var(--cheese);color:var(--ink);border-block:3px solid var(--ink);overflow:hidden}
.ticker .row{display:flex;width:max-content;animation:tick 28s linear infinite}
.ticker span{font:900 1.35rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;padding:.6em 0;white-space:nowrap}
.ticker span::after{content:"✦";margin-inline:.9em;color:var(--ketchup)}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .row{animation:none}}

/* why */
.why{padding-block:64px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px 30px;margin-bottom:30px}
.sec-head h2{font-size:clamp(2.4rem,6vw,4.2rem)}
.sec-head p{max-width:44ch;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:860px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:#FFFFFF;border:2.5px solid var(--ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--ink)}
.card .ill{height:150px;border-radius:12px;background:var(--ink);display:grid;place-items:center;overflow:hidden}
.card .ill svg{width:80%;height:80%}
.card h3{font-size:1.9rem}
.card p{color:var(--muted)}
.press-line{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:1.02rem}
.press-line a{font-weight:700}

/* menu */
.menu{padding-block:64px;background:var(--ink);color:var(--on-ink)}
.menu .sec-head p{color:var(--on-ink-muted)}
.menu .eyebrow{color:var(--cheese)}
.menu-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media (max-width:900px){.menu-grid{grid-template-columns:minmax(0,1fr)}}
.sig{background:var(--cheese);color:var(--ink);border-radius:24px;padding:22px;position:relative;overflow:hidden}
.sig .tag{position:absolute;top:20px;right:-38px;transform:rotate(35deg);background:var(--ketchup);color:#FFF4E2;font:800 .8rem/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;padding:.5em 3em}
.sig .pic{aspect-ratio:4/3;display:grid;place-items:center}
.sig .pic svg{width:86%;height:auto}
.sig h3{font-size:clamp(2.4rem,5vw,3.4rem)}
.sig .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sig .price{font:900 1.6rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.sig p{margin-top:6px;font-weight:500}
.groups{display:grid;gap:26px;min-width:0}
.group h3{font-size:1.7rem;color:var(--cheese);border-bottom:2px solid var(--ink-line);padding-bottom:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;border-bottom:1px dashed var(--ink-line)}
.item .nm{font:800 1.35rem/1.1 var(--font-display);letter-spacing:.02em;text-transform:uppercase}
.item .pr{font:800 1.2rem/1.1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--cheese);text-align:right}
.item .ds{grid-column:1/-1;color:var(--on-ink-muted);font-size:.95rem}
.item .tags{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.t{font:700 .7rem/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:.35em .5em;border-radius:6px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--on-ink)}
.t.spicy{background:var(--ketchup);border-color:var(--ketchup);color:#FFF4E2}
.t.pick{background:var(--cheese);border-color:var(--cheese);color:var(--ink)}
.menu-cta{margin-top:30px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.menu-cta strong{font:900 1.6rem/1 var(--font-display);text-transform:uppercase;margin-right:6px}

/* gallery */
.gallery{padding-block:56px 40px;overflow:hidden}
.strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px var(--gut) 18px;margin-inline:calc(var(--gut)*-1)}
.shot{flex:0 0 clamp(200px,26vw,280px);aspect-ratio:4/5;border-radius:16px;border:2.5px solid var(--ink);scroll-snap-align:start;position:relative;overflow:hidden;margin:0;
  background:repeating-linear-gradient(135deg,#F3D3E5 0 14px,#EBC2DA 14px 28px);transition:transform .25s}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot:nth-child(even){background:repeating-linear-gradient(135deg,#26212A 0 14px,#1E1A20 14px 28px)}
.shot:hover{transform:translateY(-4px) rotate(-1deg)}
.shot .cap{position:absolute;left:10px;right:10px;bottom:10px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:.5em .7em;font:800 .95rem/1.15 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.shot .cam{position:absolute;top:12px;left:12px;width:34px;height:34px;color:var(--ink)}
.shot:nth-child(even) .cam{color:var(--cheese)}

/* reviews */
.reviews{padding-block:30px 64px}
.rv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:#FFFFFF;border:2.5px solid var(--ink);border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:8px 8px 0 var(--cheese)}
@media (max-width:700px){.rv{grid-template-columns:minmax(0,1fr)}}
.score{font:900 clamp(5rem,13vw,8rem)/.85 var(--font-display)}
.score small{display:block;font-size:1.2rem;letter-spacing:.06em;margin-top:8px}
.stars5{position:relative;display:inline-block;font-size:1.7rem;letter-spacing:.1em;color:#EBD7E1;line-height:1}
.stars5 span{position:absolute;inset:0;overflow:hidden;color:var(--cheese-deep);white-space:nowrap}
.rv p{color:var(--muted);margin-top:10px}

/* find us */
.find{background:var(--cheese);color:var(--ink);padding-block:64px;border-top:3px solid var(--ink)}
.find h2{font-size:clamp(2.8rem,8vw,5.8rem)}
.find-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;margin-top:28px;align-items:start}
@media (max-width:900px){.find-grid{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:22px;display:grid;gap:18px;min-width:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;align-items:baseline;margin:0}
.kv dt{font:800 .85rem/1.4 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.addr-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.addr{font:900 1.7rem/1.05 var(--font-display);text-transform:uppercase}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hours td{padding:6px 0;border-bottom:1px dashed var(--paper-line)}
.hours td:last-child{text-align:right;font-weight:600}
.hours tr.today td{font-weight:800}
.near{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.near div{background:var(--ink);color:var(--on-ink);border-radius:14px;padding:14px}
.near b{display:block;font:900 1.6rem/1 var(--font-display);color:var(--cheese);margin-bottom:6px}
.near span{font-size:.92rem}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.storefront{aspect-ratio:4/3.4;border-radius:20px;border:2.5px solid var(--ink);position:relative;overflow:hidden;background:var(--ink)}
.storefront svg{position:absolute;inset:0;width:100%;height:100%}
.storefront .cap{position:absolute;left:12px;bottom:12px;right:12px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:.5em .7em;font-weight:600;font-size:.9rem}

/* footer */
footer{background:var(--ink);color:var(--on-ink-muted);padding-block:40px 30px}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px}
footer h3{font-size:1.2rem;color:var(--cheese);margin-bottom:8px}
footer a{color:var(--on-ink)}
footer .logo{font-size:1.9rem}
footer small{display:block;grid-column:1/-1;border-top:1px solid var(--ink-line);padding-top:16px}

/* mobile bar */
.mbar{display:none}
@media (max-width:760px){
  .mbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);border-top:3px solid var(--cheese);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;border-radius:10px;text-decoration:none;color:var(--on-ink);font:800 .85rem/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
  .mbar a.go{background:var(--cheese);color:var(--ink)}
  .mbar svg{width:22px;height:22px}
  body{padding-bottom:78px}
}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--cheese);font:800 1rem/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;padding:.8em 1.2em;border-radius:12px;z-index:60}
</style>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function track(ev){ try{ (window.dataLayer = window.dataLayer || []).push({event:ev}); }catch(e){} }
document.addEventListener('click', e => { const t = e.target.closest('[data-track]'); if (t) track(t.dataset.track); });

const browserLang = (navigator.language || 'el').toLowerCase().startsWith('el') ? 'el' : 'en';
let lang = browserLang;
try { lang = localStorage.getItem('bb_lang') || browserLang; } catch(e){}

const fmtPrice = p => p == null ? null : (lang === 'el' ? p.toFixed(2).replace('.', ',') + ' €' : '€' + p.toFixed(2));

function renderMenu(){
  const t = T[lang];
  const sig = MENU[0].items.find(i => i.signature);
  $('#sig').innerHTML = `<span class="tag">${esc(t.tag_pick)}</span>
    <div class="pic"><svg viewBox="0 0 240 200" role="img" aria-label="${esc(sig.name[lang])}"><use href="#burger-flat"/></svg></div>
    <div class="row"><h3>${esc(sig.name[lang])}</h3><span class="price">${fmtPrice(sig.price) || `<span class="ph" style="opacity:1">${esc(t.price_ph)}</span>`}</span></div>
    <p>${esc(sig.desc[lang])}</p>`;
  $('#groups').innerHTML = MENU.map(g => {
    const items = g.items.filter(i => !i.signature);
    if (!items.length) return '';
    return `<div class="group"><h3>${esc(g.title[lang])}</h3>${items.map(i => {
      const tags = (i.tags || []).map(k => `<span class="t ${k}">${esc(t['tag_' + k])}</span>`).join('');
      const price = i.placeholder ? `<span class="ph">${esc(t.ph_item)}</span>` : (fmtPrice(i.price) || `<span class="ph">${esc(t.price_ph)}</span>`);
      return `<div class="item"><span class="nm">${esc(i.name[lang])}${tags ? `<span class="tags">${tags}</span>` : ''}</span><span class="pr">${price}</span>${i.desc ? `<p class="ds">${esc(i.desc[lang])}</p>` : ''}</div>`;
    }).join('')}</div>`;
  }).join('');
}

function renderGallery(){
  $('#strip').innerHTML = GALLERY.map(g => `<figure class="shot">${g.img ? `<img src="${g.img}" alt="${esc(g[lang])}" loading="lazy">` : '<svg class="cam" aria-hidden="true"><use href="#i-cam"/></svg>'}<figcaption class="cap">${esc(g[lang])}${g.img ? '' : ' <span class="ph">' + esc(T[lang].photo_ph) + '</span>'}</figcaption></figure>`).join('');
}

/* ---------- ωράριο & «ανοιχτά τώρα» (ώρα Αθήνας) ---------- */
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const toMin = s => { const [h, m] = s.split(':').map(Number); return h*60 + m; };
function athensNow(){
  const parts = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/Athens', weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date());
  const get = k => parts.find(p => p.type === k).value;
  return { day: {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[get('weekday')], min: Number(get('hour'))*60 + Number(get('minute')) };
}
function status(){
  const t = T[lang], now = athensNow();
  if (!Object.values(HOURS).some(v => Array.isArray(v))) return { cls:'', txt:t.st_known };
  const today = HOURS[DAY_KEYS[now.day]], yest = HOURS[DAY_KEYS[(now.day + 6) % 7]];
  if (Array.isArray(today)){
    const O = toMin(today[0]); let C = toMin(today[1]); if (C <= O) C += 1440;
    if (now.min >= O && now.min < C) return { cls:'open', txt:t.st_open.replace('{t}', today[1]) };
  }
  if (Array.isArray(yest) && toMin(yest[1]) <= toMin(yest[0]) && now.min < toMin(yest[1])) return { cls:'open', txt:t.st_open.replace('{t}', yest[1]) };
  for (let i = 0; i < 7; i++){
    const k = DAY_KEYS[(now.day + i) % 7], d = HOURS[k];
    if (Array.isArray(d) && (i > 0 || toMin(d[0]) > now.min)) return { cls:'closed', txt:t.st_closed.replace('{t}', (i ? t.days[k].slice(0,3) + ' ' : '') + d[0]) };
  }
  return { cls:'closed', txt:t.hours_closed };
}
function renderHours(){
  const t = T[lang], today = DAY_KEYS[athensNow().day];
  $('#hours').innerHTML = ['mon','tue','wed','thu','fri','sat','sun'].map(k => {
    const v = HOURS[k];
    const txt = v === 'closed' ? t.hours_closed : (Array.isArray(v) ? `${v[0]} – ${v[1]}` : `<span class="ph">${esc(t.hours_unknown)}</span>`);
    return `<tr class="${k === today ? 'today' : ''}"><td>${t.days[k]}</td><td>${txt}</td></tr>`;
  }).join('');
  const s = status();
  ['#pillTop', '#pillFind'].forEach(id => { const p = $(id); p.classList.remove('open', 'closed'); if (s.cls) p.classList.add(s.cls); p.querySelector('.pill-txt').textContent = s.txt; });
}

/* ---------- παραγγελία ---------- */
function renderOrder(){
  const t = T[lang];
  const links = Object.entries(ORDER_LINKS).filter(([, u]) => u);
  $('#orderBtns').innerHTML = links.map(([k, u]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener" data-track="order_${k}"><svg><use href="#i-bag"/></svg>${esc(t[k])}</a>`).join('');
  $$('.order-link').forEach(a => {
    const label = a.querySelector('span');
    if (links.length === 1){ a.href = links[0][1]; a.target = '_blank'; a.rel = 'noopener'; }
    else if (!links.length){ a.href = 'tel:+306997019785'; a.removeAttribute('target'); if (label && !a.closest('.mbar')) label.textContent = t.order_call; }
    else { a.href = '#find'; a.removeAttribute('target'); }
  });
}

/* ---------- γλώσσα ---------- */
function applyLang(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
  $$('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $$('.stage .lbl').forEach(el => el.textContent = t['lbl_' + el.dataset.layer]);
  const tk = t.ticker.map(w => `<span>${esc(w)}</span>`).join('');
  $('#ticker').innerHTML = tk + tk + tk + tk;
  renderMenu(); renderGallery(); renderHours(); renderOrder();
}
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('bb_lang', lang); } catch(e){}
  track('lang_' + lang); applyLang();
}));
applyLang();
setInterval(renderHours, 60000);
$('#yr').textContent = new Date().getFullYear();

/* ---------- αντιγραφή διεύθυνσης ---------- */
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }
$('#copyAddr').addEventListener('click', () => {
  const txt = 'Bonnie Burgers, Φαλήρου 40, Κουκάκι, Αθήνα 117 42';
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#addrTxt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(txt).then(() => toast(T[lang].copied), fallback); } catch(e){ fallback(); }
});

/* =====================  3D: THE SMASH STACK  ===================== */
(function(){
  const canvas = $('#burger'), stage = $('#stage'), fallback = $('#stage .fallback'), labels = $$('.stage .lbl');
  function webgl(){ try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); } catch(e){ return false; } }
  const lowEnd = (navigator.hardwareConcurrency || 8) <= 2 || (navigator.deviceMemory && navigator.deviceMemory <= 2);
  function useFallback(){ canvas.hidden = true; fallback.hidden = false; $('#tapHint').hidden = true; labels.forEach(l => l.hidden = true); }
  if (typeof THREE === 'undefined' || !webgl() || lowEnd){ useFallback(); return; }
  const start = () => { try { build(); } catch(err){ console.warn('3D off', err); useFallback(); } };
  if ('requestIdleCallback' in window) requestIdleCallback(start, {timeout:600}); else setTimeout(start, 120);

  function build(){
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x2a180c, 0.42));
    const key = new THREE.DirectionalLight(0xffe2b8, 0.62); key.position.set(4, 7, 6); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffb3d6, 0.5); rim.position.set(-6, 3, -4); scene.add(rim);
    const fill = new THREE.DirectionalLight(0xffffff, 0.12); fill.position.set(-3, 2, 6); scene.add(fill);

    const grad = new THREE.DataTexture(new Uint8Array([70, 130, 190, 235]), 4, 1, THREE.LuminanceFormat);
    grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.generateMipmaps = false; grad.needsUpdate = true;
    const toon = (c, extra = {}) => new THREE.MeshToonMaterial(Object.assign({color:c, gradientMap:grad}, extra));
    const V = (x, y) => new THREE.Vector2(x, y);
    const rand = (a, b) => a + Math.random()*(b - a);

    const burger = new THREE.Group();
    const layers = [];
    const addLayer = (obj, base, k, labelKey) => { obj.position.y = base; burger.add(obj); layers.push({obj, base, k, labelKey}); return obj; };

    addLayer(new THREE.Mesh(new THREE.LatheGeometry([V(0,0),V(1.45,0),V(1.62,0.07),V(1.7,0.24),V(1.66,0.42),V(1.55,0.5),V(0,0.5)], 64), toon(0xC27A34)), 0, 0);

    function patty(){
      const g = new THREE.CylinderGeometry(1.8, 1.74, 0.3, 72, 2);
      const pos = g.attributes.position, v = new THREE.Vector3(), ph = rand(0, 6.28);
      for (let i = 0; i < pos.count; i++){
        v.fromBufferAttribute(pos, i);
        const r = Math.hypot(v.x, v.z);
        if (r > 0.5){
          const a = Math.atan2(v.z, v.x);
          const n = 1 + Math.sin(a*7 + ph)*0.035 + Math.sin(a*13 + ph*2)*0.025 + Math.sin(a*29)*0.012;
          v.x *= n; v.z *= n;
          if (r > 1.6) v.y += Math.sin(a*11 + ph)*0.03;
        }
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      g.computeVertexNormals();
      const grp = new THREE.Group();
      grp.add(new THREE.Mesh(g, toon(0x4E2812)));
      const crust = new THREE.Mesh(new THREE.TorusGeometry(1.78, 0.09, 8, 72), toon(0x2A1408));
      crust.rotation.x = Math.PI/2; crust.scale.z = 0.7; grp.add(crust);
      return grp;
    }
    function cheese(){
      const g = new THREE.PlaneGeometry(2.75, 2.75, 30, 30);
      g.rotateX(-Math.PI/2);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++){
        const d = Math.hypot(pos.getX(i), pos.getZ(i));
        if (d > 1.66) pos.setY(i, -(d - 1.66)*(d - 1.66)*1.1 - (d - 1.66)*0.35);
      }
      g.computeVertexNormals();
      const m = new THREE.Mesh(g, toon(0xF5A611, {side:THREE.DoubleSide}));
      m.rotation.y = rand(0.6, 0.9);
      return m;
    }
    addLayer(patty(), 0.66, 1);
    addLayer(cheese(), 0.83, 2);
    addLayer(patty(), 1.0, 3, 'patty');
    addLayer(cheese(), 1.17, 4, 'cheese');

    const pickles = new THREE.Group();
    const pickleMat = toon(0x6F9A3A), pickleIn = toon(0xB7D27A);
    [[0.55,0.2],[-0.6,0.35],[0.05,-0.65],[-0.15,0.75]].forEach(([x, z]) => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.05,24), pickleMat);
      const c = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.055,24), pickleIn);
      p.position.set(x,0,z); c.position.set(x,0.002,z); p.rotation.z = c.rotation.z = rand(-0.12,0.12);
      pickles.add(p, c);
    });
    addLayer(pickles, 1.26, 5, 'pickles');

    const sauce = new THREE.Group();
    const sauceMat = toon(0xE0703A);
    const blob = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), sauceMat); blob.scale.set(1.25, 0.07, 1.25); sauce.add(blob);
    for (let i = 0; i < 7; i++){
      const a = i/7*Math.PI*2 + rand(-0.2, 0.2);
      const d = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), sauceMat);
      d.scale.set(1.2, rand(1.1, 1.7), 1); d.position.set(Math.cos(a)*1.28, -0.07, Math.sin(a)*1.28); sauce.add(d);
    }
    addLayer(sauce, 1.33, 6, 'sauce');

    const top = new THREE.Group();
    const prof = [V(0,0),V(1.6,0),V(1.7,0.16),V(1.63,0.6),V(1.38,1.0),V(0.92,1.3),V(0.45,1.43),V(0,1.46)];
    top.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 64), toon(0xB8692A)));
    const rAt = y => { for (let j = 3; j < prof.length; j++){ const a = prof[j-1], b = prof[j]; if (y >= a.y && y <= b.y) return a.x + (b.x - a.x)*(y - a.y)/(b.y - a.y); } return 0; };
    const seedGeo = new THREE.SphereGeometry(1, 8, 6), seedMat = toon(0xFFF1D6);
    for (let i = 0; i < 48; i++){
      const y = rand(0.62, 1.42), phi = rand(0, Math.PI*2), r = rAt(y) + 0.012;
      const x = r*Math.cos(phi), z = r*Math.sin(phi);
      const s = new THREE.Mesh(seedGeo, seedMat); s.scale.set(0.055, 0.028, 0.11);
      s.position.set(x, y, z);
      s.lookAt(x*2, y + (y - 0.3)*1.2, z*2); s.rotateZ(rand(0, Math.PI));
      top.add(s);
    }
    addLayer(top, 1.42, 7);

    const sc = document.createElement('canvas'); sc.width = sc.height = 128; const g2 = sc.getContext('2d');
    const rg = g2.createRadialGradient(64,64,4,64,64,62); rg.addColorStop(0,'rgba(0,0,0,.55)'); rg.addColorStop(1,'rgba(0,0,0,0)'); g2.fillStyle = rg; g2.fillRect(0,0,128,128);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc), transparent:true, depthWrite:false}));
    shadow.rotation.x = -Math.PI/2; shadow.position.y = -0.02; burger.add(shadow);

    const stc = document.createElement('canvas'); stc.width = stc.height = 64; const g3 = stc.getContext('2d');
    const rg2 = g3.createRadialGradient(32,32,2,32,32,30); rg2.addColorStop(0,'rgba(255,245,230,.9)'); rg2.addColorStop(1,'rgba(255,245,230,0)'); g3.fillStyle = rg2; g3.fillRect(0,0,64,64);
    const steamTex = new THREE.CanvasTexture(stc);
    const steam = [];
    for (let i = 0; i < 16; i++){
      const s = new THREE.Sprite(new THREE.SpriteMaterial({map:steamTex, transparent:true, depthWrite:false, opacity:0}));
      s.userData = {t: Math.random(), x: rand(-0.9, 0.9), z: rand(-0.9, 0.9), sp: rand(0.12, 0.22)};
      burger.add(s); steam.push(s);
    }
    scene.add(burger);

    const pointer = {x:0, y:0}, tilt = {x:0, y:0};
    addEventListener('pointermove', e => { pointer.x = e.clientX/innerWidth*2 - 1; pointer.y = e.clientY/innerHeight*2 - 1; }, {passive:true});
    let tapOpen = false;
    canvas.tabIndex = 0;
    canvas.addEventListener('click', () => { tapOpen = !tapOpen; track('burger_tap'); });
    canvas.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tapOpen = !tapOpen; } });

    const hero = $('.hero');
    let visible = true;
    new IntersectionObserver(([en]) => { visible = en.isIntersecting; }, {rootMargin:'60px'}).observe(stage);
    function resize(){ const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
    new ResizeObserver(resize).observe(stage); resize();

    const t0 = performance.now(), lv = new THREE.Vector3();
    let e = 0;
    function frame(now){
      requestAnimationFrame(frame);
      if (!visible) return;
      const t = (now - t0)/1000;
      const rect = hero.getBoundingClientRect();
      const p = Math.min(1, Math.max(0, -rect.top / Math.max(1, rect.height*0.75)));
      const scrollOpen = Math.sin(Math.PI*p);
      const intro = reduceMotion ? 0 : (t > 1.2 && t < 3.8 ? Math.sin(Math.PI*(t - 1.2)/2.6) : 0);
      const target = Math.max(scrollOpen, intro, tapOpen ? 1 : 0);
      e += (target - e)*(reduceMotion ? 1 : 0.08);

      layers.forEach(L => { L.obj.position.y = L.base + L.k*0.5*e; });
      if (!reduceMotion){ burger.rotation.y += 0.004; burger.position.y = Math.sin(t*1.6)*0.05; }
      tilt.x += (pointer.x*0.35 - tilt.x)*0.06; tilt.y += (pointer.y*0.15 - tilt.y)*0.06;
      burger.rotation.z = -tilt.x*0.25; burger.rotation.x = 0.08 + tilt.y*0.6;
      const narrow = stage.clientWidth < 420;
      camera.position.set(0, 3.0 + e*1.6, (narrow ? 10.4 : 9.4) + e*3.4);
      camera.lookAt(0, 0.85 + e*1.75, 0);

      const topY = layers[layers.length - 1].obj.position.y + 1.5;
      steam.forEach(s => {
        const d = s.userData; d.t += reduceMotion ? 0 : d.sp*0.016;
        if (d.t > 1){ d.t = 0; d.x = rand(-0.9, 0.9); d.z = rand(-0.9, 0.9); }
        s.position.set(d.x + Math.sin(d.t*6 + d.z)*0.15, topY + d.t*2.2, d.z);
        const sz = 0.5 + d.t*0.9; s.scale.set(sz, sz, 1);
        s.material.opacity = reduceMotion ? 0 : Math.sin(Math.PI*d.t)*0.22;
      });

      renderer.render(scene, camera);

      const w = stage.clientWidth, h = stage.clientHeight;
      let side = 0;
      labels.forEach(el => {
        const L = layers.find(l => l.labelKey === el.dataset.layer);
        if (!L){ el.style.opacity = 0; return; }
        const right = side++ % 2 === 0;
        L.obj.getWorldPosition(lv); lv.x += right ? 1.9 : -1.9; lv.project(camera);
        const x = (lv.x*0.5 + 0.5)*w, y = (-lv.y*0.5 + 0.5)*h;
        el.classList.toggle('r', right); el.classList.toggle('l', !right);
        const lw = el.offsetWidth;
        const px = right ? Math.min(x + 22, w - lw - 4) : Math.max(x - lw - 22, 4);
        el.style.transform = `translate(${px}px, ${y - el.offsetHeight/2}px)`;
        el.style.opacity = e > 0.45 ? Math.min(1, (e - 0.45)*3) : 0;
      });
    }
    requestAnimationFrame(frame);
  }
})();
</script>
